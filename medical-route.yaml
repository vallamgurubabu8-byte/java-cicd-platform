apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medical-api-route
  namespace: medical-appointment
spec:
  parentRefs:
    - name: medical-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: medical-appointment-api-generic-test-service
          port: 8081
