
project:
  name: medical-appointment-api
  repository: https://github.com/vallamgurubabu8-byte/MedicalAppointmentSystemAPI.git
  defaultBranch: main

build:
  tool: maven
  javaVersion: "21"
  artifactPath: target/*.jar
  testCommand: verify

container:
  imageName: medical-appointment-api
  dockerfile: Dockerfile
  port: 8080

database:
  url: jdbc:mysql://mysql-service:3306/MedicalASDb?createDatabaseIfNotExist=true
    username: root
    secretName: mysql-secret
    passwordKey: MYSQL_ROOT_PASSWORD
  enabled: true
  mode: managed
  type: mysql
  version: "8.4"
  databaseName: MedicalASDb
  storage: 5Gi
  # credentials:
  #   username: root
  #   secretName: mysql-secret
  #   passwordKey: MYSQL_ROOT_PASSWORD

deployment:
  namespace: medical-appointment
  imagePullSecret: registry-secret
  name: medical-appointment-api-generic-test
  containerName: medical-appointment-api
  serviceName: medical-appointment-api-generic-test-service
  replicas: 1
  serviceType: ClusterIP
  servicePort: 8081
  targetPort: 8080

  database:
    url: jdbc:mysql://mysql-service:3306/MedicalASDb?createDatabaseIfNotExist=true
    username: root
    secretName: mysql-secret
    passwordKey: MYSQL_ROOT_PASSWORD
